<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{partials/_header :: common_header(~{::title/text()},~{::link},~{::meta})}">
    <!-- Custom meta data for this template-->
    <meta name="description" content="mems marks page">
    <meta name="author" content="mfano">
    <!-- Custom title for this page-->
    <title>MEMS | Marks</title>
    <!-- Custom styles for this page-->
</th:block>

<body>

    <!-- ======= Header ======= -->
    <th:block th:insert="~{partials/_topbar}" />
    <!-- =====End Header===== -->

    <!-- ======= Sidebar ======= -->
    <th:block th:insert="~{partials/_sidebar}" />
    <!-- =====End Sidebar=====-->

    <main id="main" class="main">

        <!-- Page Heading -->
        <div class="pagetitle d-sm-flex align-items-center justify-content-between mb-4">
            <div>
                <h1 class="fw-bold mb-1">
                    Student marks
                </h1>

                <p class="text-muted mb-0">
                    Student examination marks center
                </p>
            </div>

            <!-- Breadcrumb -->
            <nav>
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/}">Teacher</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Marks</li>
                </ol>
            </nav>
        </div><!-- End Page Title -->

        <!-- MARKS -->
        <!-- FILTERS -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body mt-4">
                <form method="get" th:action="@{/marks}" class="row g-3">
                    <div class="col-md-4">
                        <select name="exam" class="form-select" onchange="this.form.submit()">
                            <option value="">Exam...</option>
                            <option th:each="e : ${exams}" th:value="${e.id}"
                                th:text="${e.name + ' - T' + e.term?.t + ', ' + e.term?.y}"
                                th:selected="${e.id == selectedExam}">END TERM EXAM - T1 2027</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select name="grade" class="form-select" onchange="this.form.submit()">
                            <option value="">Grade...</option>
                            <option th:each="g : ${grades}" th:value="${g.id}" th:text="${g.name}"
                                th:selected="${g.id == selectedGrade}">Grade 4</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select name="subject" class="form-select" onchange="this.form.submit()">
                            <option value="">Subject...</option>
                            <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}"
                                th:selected="${s.id == selectedSubject}">Mathematics</option>
                        </select>
                    </div>
                </form>
                <small class="text-muted d-block mt-2">Choose an exam, grade and subject to enter marks. Create
                    exams and subjects first if the lists are empty</small>
            </div>
        </div>

        <!-- MARKS ENTRY TABLE -->
        <div th:if="${students != null and !#lists.isEmpty(students)}" class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <form th:action="@{/marks/save}" method="post">
                    <input type="hidden" name="exam" th:value="${selectedExam}">
                    <input type="hidden" name="subject" th:value="${selectedSubject}">

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ADM NO</th>
                                    <th>STUDENT NAME</th>
                                    <th>SCORE /100</th>
                                    <th>LEVEL</th>
                                    <th>POINTS</th>
                                    <th>REMARK</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s, iter : ${students}">
                                    <input type="hidden" th:name="'marks[' + ${iter.index} + '].student'"
                                        th:value="${s.id}">
                                    <td th:text="${s.admissionNumber}">1000</td>
                                    <td class="fw-semibold text-uppercase" th:text="${s.firstName + ' ' + s.lastName}">
                                        FURAHA KADHENGE
                                    </td>
                                    <td>
                                        <input type="number" th:name="'marks[' + ${iter.index} + '].score'"
                                            th:value="${existingMarks[s.id]}" ma
                                            class="form-control form-control-sm score-input" min="0" max="100" required>
                                    </td>
                                    <td><span th:id="'level-' + ${s.id}">-</span></td>
                                    <td><span th:id="'points-' + ${s.id}">-</span></td>
                                    <td><span th:id="'remark-' + ${s.id}" class="text-muted">-</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="p-3 text-end">
                        <button type="submit" class="btn text-white" style="background:#00a67e; border-radius:8px;">
                            <i class="fa-solid fa-save"></i> Save Marks
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main><!-- End #main -->

    <!-- =====footer===== -->
    <th:block th:insert="~{partials/_footer}" />

    <script>
        // Auto calculate CBC level on score change
        document.querySelectorAll('.score-input').forEach(input => {
            input.addEventListener('input', function () {
                let score = parseInt(this.value) || 0;
                let row = this.closest('tr');
                let id = row.querySelector('input[type=hidden]').value;

                let level = '', points = '', remark = '';

                if (score >= 90) { level = 'EE2'; points = 8; remark = 'Exceeding'; }
                else if (score >= 75) { level = 'EE1'; points = 7; remark = 'Exceeding'; }
                else if (score >= 59) { level = 'ME2'; points = 6; remark = 'Meeting'; }
                else if (score >= 40) { level = 'ME1'; points = 5; remark = 'Meeting'; }
                else if (score >= 31) { level = 'AE2'; points = 4; remark = 'Approaching'; }
                else if (score >= 21) { level = 'AE1'; points = 3; remark = 'Approaching'; }
                else if (score >= 11) { level = 'BE2'; points = 2; remark = 'Below'; }
                else { level = 'BE1'; points = 1; remark = 'Below'; }

                document.getElementById('level-' + id).textContent = level;
                document.getElementById('points-' + id).textContent = points;
                document.getElementById('remark-' + id).textContent = remark;
            });
            input.dispatchEvent(new Event('input')); // trigger on load
        });
    </script>
</body>

</html>
